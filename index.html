<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetControl - Pastelería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* Diseño de scrollbar profesional */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;
    
    // Importaciones de Base de Datos (Agregamos getDocs para el borrado masivo)
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Configuración Segura
    const firebaseConfig = {
      apiKey: "AIzaSyDxRbgfPR04Ecn0RPbDXFRXrY0gC1qf638",
      authDomain: "sweetcontrol-bd.firebaseapp.com",
      projectId: "sweetcontrol-bd",
      storageBucket: "sweetcontrol-bd.firebasestorage.app",
      messagingSenderId: "1062190162900",
      appId: "1:1062190162900:web:055631b9cd40239450ec41",
      measurementId: "G-CY32ETW41C"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sweet-control-app';

    // Iconos Universales
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        box: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />,
        book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
        chef: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 15c0-4.418-4.03-8-9-8s-9 3.582-9 8h18zM15 7V3h-6v4" />,
        dollar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
        users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
        warning: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      };
      return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">{icons[name] || icons.box}</svg>;
    };

    function BakeryControlSystem() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [user, setUser] = useState(null);
      const [authError, setAuthError] = useState(null);
      
      const [ingredients, setIngredients] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [sales, setSales] = useState([]);
      const [debtors, setDebtors] = useState([]);
      const [expenses, setExpenses] = useState([]);
      
      const [finances, setFinances] = useState({ savingsPercentage: 50 });
      const [generalSettings, setGeneralSettings] = useState({ name: 'SweetControl', logo: null, currency: 'USD', rateBs: 40, rateEur: 0.92 });

      const [showModal, setShowModal] = useState(false);
      const [modalType, setModalType] = useState(''); 
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [editingIngredient, setEditingIngredient] = useState(null);

      const [notification, setNotification] = useState({ show: false, message: '', type: 'info' });

      const showNotification = (message, type = 'info') => {
        setNotification({ show: true, message, type });
        setTimeout(() => setNotification({ show: false, message: '', type: 'info' }), 5000);
      };

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth Error:", error);
            setAuthError(error.message);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        try {
          const basePath = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);

          const unsubIngredients = onSnapshot(basePath('ingredients'), snap => setIngredients(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubRecipes = onSnapshot(basePath('recipes'), snap => setRecipes(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubSales = onSnapshot(basePath('sales'), snap => setSales(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)));
          const unsubDebtors = onSnapshot(basePath('debtors'), snap => setDebtors(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubExpenses = onSnapshot(basePath('expenses'), snap => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)));

          const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'finances'), docSnap => {
            if (docSnap.exists()) setFinances(docSnap.data());
          });
          const unsubGeneral = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), docSnap => {
            if (docSnap.exists()) setGeneralSettings(prev => ({ ...prev, ...docSnap.data() }));
          });

          return () => { unsubIngredients(); unsubRecipes(); unsubSales(); unsubDebtors(); unsubExpenses(); unsubSettings(); unsubGeneral(); };
        } catch (e) {
           setAuthError(e.message);
        }
      }, [user]);

      // VISTA DE ERROR DE CONEXIÓN LOCAL
      if (authError) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-6 text-center">
            <div className="bg-white text-gray-800 p-8 rounded-2xl max-w-lg border border-red-200 shadow-xl animate-fade-in">
              <div className="bg-red-100 text-red-600 p-4 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-6">
                <Icon name="warning" className="w-12 h-12" />
              </div>
              <h2 className="text-2xl font-black mb-2">Conexión a la Nube Bloqueada</h2>
              <p className="text-base text-gray-600 font-medium mb-6">
                Estás abriendo este sistema directamente desde tu computadora. Por seguridad, la base de datos bloquea el acceso local.
              </p>
              <p className="text-xs text-gray-400">Detalle técnico: {authError}</p>
            </div>
          </div>
        );
      }

      if (!user) {
        return <div className="min-h-screen flex items-center justify-center bg-gray-50 text-indigo-600 font-medium">Estableciendo conexión segura...</div>;
      }

      const formatCurrency = (amount) => {
        let converted = amount;
        let symbol = '$';
        if (generalSettings.currency === 'VES') { converted = amount * generalSettings.rateBs; symbol = 'Bs '; } 
        else if (generalSettings.currency === 'EUR') { converted = amount * generalSettings.rateEur; symbol = '€'; }
        return `${symbol}${converted.toFixed(2)}`;
      };

      const formatUnit = (amount, unit) => {
        if (amount >= 1000 && unit === 'g') return `${(amount / 1000).toFixed(2)} kg`;
        if (amount >= 1000 && unit === 'ml') return `${(amount / 1000).toFixed(2)} L`;
        return `${amount.toFixed(1)} ${unit}`;
      };

      const exportBackup = () => {
        const backupData = { ingredients, recipes, sales, debtors, expenses, finances, generalSettings };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Respaldo_${generalSettings.name}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const calculateRecipeCost = (recipe) => {
        return recipe.ingredients.reduce((total, req) => {
          const ing = ingredients.find(i => i.id === req.ingredientId);
          return total + (ing ? (ing.costPerUnit || 0) * req.qty : 0);
        }, 0);
      };

      const calculateMaxYield = (recipe) => {
        let maxBatches = Infinity; 
        for (const req of recipe.ingredients) {
          const ing = ingredients.find(i => i.id === req.ingredientId);
          if (!ing || ing.stock < req.qty || req.qty === 0) return { batches: 0, portions: 0 };
          const batches = Math.floor(ing.stock / req.qty);
          if (batches < maxBatches) maxBatches = batches;
        }
        if (maxBatches === Infinity) return { batches: 0, portions: 0 };
        return {
          batches: maxBatches,
          portions: maxBatches * (recipe.portions || 1) 
        };
      };

      const handleAddPurchase = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const ingredientId = fd.get('ingredientId');
        const qty = parseFloat(fd.get('qty'));
        const totalCost = parseFloat(fd.get('totalCost'));

        if (qty <= 0 || totalCost <= 0) return showNotification("Los valores deben ser mayores a 0", 'error');
        const ing = ingredients.find(i => i.id === ingredientId);
        if (!ing) return;

        const currentTotalValue = (ing.stock || 0) * (ing.costPerUnit || 0);
        const newTotalValue = currentTotalValue + totalCost;
        const newStock = (ing.stock || 0) + qty;
        const newCostPerUnit = newTotalValue / newStock;

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', ingredientId), { stock: newStock, costPerUnit: newCostPerUnit }, { merge: true });
        setShowModal(false);
        showNotification("Compra registrada e inventario actualizado.", 'success');
      };

      const handleSaveIngredient = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const id = editingIngredient ? editingIngredient.id : Date.now().toString();
        const data = {
          name: fd.get('name'), 
          unit: fd.get('unit'), 
          stock: editingIngredient ? editingIngredient.stock : 0, 
          costPerUnit: editingIngredient ? editingIngredient.costPerUnit : 0
        };
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', id), data, { merge: true });
        setShowModal(false);
        setEditingIngredient(null);
        showNotification(editingIngredient ? "Ingrediente actualizado." : "Ingrediente añadido exitosamente.", 'success');
      };

      const handleDeleteIngredient = async (id) => {
        if(recipes.some(r => r.ingredients.some(i => i.ingredientId === id))) {
            return showNotification("No puedes eliminar un ingrediente que está siendo usado en una receta.", 'error');
        }
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', id));
        showNotification("Ingrediente eliminado.", 'info');
      };

      const handleSaveRecipe = async (recipeData) => {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipeData.id), recipeData, { merge: true });
        setShowModal(false);
        setEditingRecipe(null);
        showNotification("Receta guardada exitosamente.", 'success');
      };

      const handleDeleteRecipe = async (id) => {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', id));
        showNotification("Receta eliminada.", 'info');
      };

      const handleProduce = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recipeId = fd.get('recipeId');
        const batchesToMake = parseInt(fd.get('batches')); 
        
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;

        const yieldInfo = calculateMaxYield(recipe);
        if (batchesToMake > yieldInfo.batches) {
           return showNotification(`Faltan ingredientes. Solo tienes material para hacer ${yieldInfo.batches} receta(s) completas.`, 'error');
        }

        try {
          for (const req of recipe.ingredients) {
            const ing = ingredients.find(i => i.id === req.ingredientId);
            if (ing) {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', ing.id), { stock: ing.stock - (req.qty * batchesToMake) }, { merge: true });
            }
          }
          
          const portionsProduced = batchesToMake * recipe.portions;
          const currentStock = recipe.stock || 0;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipe.id), { stock: currentStock + portionsProduced }, { merge: true });

          const remainingPortions = (yieldInfo.batches - batchesToMake) * recipe.portions;
          e.target.reset();
          showNotification(`¡Éxito! Fabricaste ${portionsProduced} porciones de ${recipe.name}.`, 'success');
        } catch (error) {
          showNotification("Error al procesar la producción.", 'error');
        }
      };

      const handleSell = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recipeId = fd.get('recipeId');
        const qtyToSell = parseInt(fd.get('qty')); 
        const salePrice = parseFloat(fd.get('price'));
        const saleType = fd.get('saleType');
        const debtorName = fd.get('debtorName');
        
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;

        if (qtyToSell > (recipe.stock || 0)) {
          return showNotification(`Solo tienes ${recipe.stock || 0} porciones listas.`, 'error');
        }

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipe.id), { stock: recipe.stock - qtyToSell }, { merge: true });

          const finalRevenue = salePrice * qtyToSell;
          const costOfWholeRecipe = calculateRecipeCost(recipe);
          const unitCost = costOfWholeRecipe / recipe.portions; 
          const timestamp = Date.now();
          const dateStr = new Date().toISOString().split('T')[0];

          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sales', timestamp.toString()), {
            date: dateStr, timestamp, recipeId, recipeName: recipe.name, qty: qtyToSell, revenue: finalRevenue, unitCost: unitCost, type: saleType
          });

          if (saleType === 'debt') {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'debtors', `debt_${timestamp}`), {
              name: debtorName || 'Cliente sin nombre', amount: finalRevenue, date: dateStr, recipeName: recipe.name
            });
          }

          e.target.reset();
          showNotification(`Venta registrada. Descontaste ${qtyToSell} porciones del stock.`, 'success');
        } catch (error) {
          showNotification("Error al registrar la venta.", 'error');
        }
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const id = Date.now().toString();
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id), {
          date: new Date().toISOString().split('T')[0],
          timestamp: Date.now(),
          description: fd.get('description'),
          amount: parseFloat(fd.get('amount'))
        });
        e.target.reset();
        showNotification("Gasto registrado.", 'success');
      };

      /* NUEVA FUNCION: Eliminar Gastos */
      const handleDeleteExpense = async (id) => {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id));
          showNotification("Gasto eliminado del registro.", 'info');
        } catch (err) {
          showNotification("Error al eliminar gasto.", 'error');
        }
      };

      /* NUEVA FUNCION: Resetear Base de Datos Masivamente con confirmación */
      const handleResetSystem = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const confirmWord = fd.get('confirmText')?.toUpperCase().trim();
        
        if (confirmWord !== 'BORRAR') {
           return showNotification("Palabra de seguridad incorrecta. No se ha borrado nada.", 'error');
        }

        try {
           const clearCol = async (colName) => {
              const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', colName));
              const promises = snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, d.id)));
              await Promise.all(promises);
           };
           
           await clearCol('ingredients');
           await clearCol('recipes');
           await clearCol('sales');
           await clearCol('debtors');
           await clearCol('expenses');
           
           setShowModal(false);
           setModalType('');
           setActiveTab('dashboard');
           showNotification("El sistema ha sido restablecido a cero por completo.", 'success');
        } catch(err) {
           showNotification("Hubo un problema intentando limpiar los datos.", 'error');
        }
      };

      const renderDashboard = () => {
        const totalInventoryValue = ingredients.reduce((acc, i) => acc + ((i.stock || 0) * (i.costPerUnit || 0)), 0);
        const finishedGoodsValue = recipes.reduce((acc, r) => acc + ((r.stock || 0) * (calculateRecipeCost(r) / (r.portions || 1))), 0);
        const totalDebt = debtors.reduce((acc, d) => acc + d.amount, 0);
        
        return (
          <div className="space-y-6 animate-fade-in">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Resumen del Negocio</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 flex items-center space-x-4">
                <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><Icon name="box" className="w-8 h-8"/></div>
                <div>
                  <p className="text-sm text-gray-500 font-medium">Materia Prima Cruda</p>
                  <p className="text-2xl font-bold text-gray-800">{formatCurrency(totalInventoryValue)}</p>
                </div>
              </div>
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center space-x-4">
                <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="chef" className="w-8 h-8"/></div>
                <div>
                  <p className="text-sm text-gray-500 font-medium">Postres Listos (Costo)</p>
                  <p className="text-2xl font-bold text-gray-800">{formatCurrency(finishedGoodsValue)}</p>
                </div>
              </div>
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-red-100 flex items-center space-x-4">
                <div className="p-3 bg-red-50 text-red-600 rounded-xl"><Icon name="users" className="w-8 h-8"/></div>
                <div>
                  <p className="text-sm text-gray-500 font-medium">Cuentas por Cobrar</p>
                  <p className="text-2xl font-bold text-gray-800">{formatCurrency(totalDebt)}</p>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderInventory = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <h2 className="text-2xl font-bold text-gray-800">Inventario (Materia Prima)</h2>
            <div className="flex gap-2 w-full sm:w-auto">
              <button onClick={() => { setEditingIngredient(null); setModalType('addIngredient'); setShowModal(true); }} className="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors shadow-sm font-medium">
                <Icon name="plus" className="w-4 h-4"/> Nuevo Ingrediente
              </button>

      );

      const CreateRecipeForm = ({ onSave, onCancel, inventory, initialData }) => {
        const [name, setName] = useState(initialData ? initialData.name : '');
        const [portions, setPortions] = useState(initialData ? initialData.portions : 1);
        const [recipeIngredients, setRecipeIngredients] = useState(initialData ? initialData.ingredients : [{ ingredientId: '', qty: 0 }]);

        const addIngredientRow = () => setRecipeIngredients([...recipeIngredients, { ingredientId: '', qty: 0 }]);
        const updateRow = (index, field, value) => {
          const newIng = [...recipeIngredients];
          newIng[index][field] = field === 'qty' ? parseFloat(value) || 0 : value;
          setRecipeIngredients(newIng);
        };
        const removeRow = (index) => setRecipeIngredients(recipeIngredients.filter((_, i) => i !== index));

        const totalCost = recipeIngredients.reduce((total, req) => {
          const ing = inventory.find(i => i.id === req.ingredientId);
          return total + (ing ? (ing.costPerUnit || 0) * req.qty : 0);
        }, 0);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name || recipeIngredients.some(r => !r.ingredientId || r.qty <= 0)) return showNotification("Completa todos los campos correctamente.", 'error');
          onSave({
            id: initialData ? initialData.id : Date.now().toString(),
            name, portions, ingredients: recipeIngredients, 
            stock: initialData ? initialData.stock : 0 
          });
        };

        return (
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Nombre de la Receta (Lote completo)</label>
              <input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border border-gray-300 p-2 rounded-lg" placeholder="Ej: Torta de Chocolate de 1 Kg" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">¿Cuántas porciones individuales rinde este lote?</label>
              <input required type="number" min="1" value={portions} onChange={e => setPortions(parseInt(e.target.value))} className="w-full border border-gray-300 p-2 rounded-lg" placeholder="Ej: 20" />
            </div>
            <div className="mt-6">
              <label className="block text-sm font-bold text-gray-700 mb-2">Ingredientes Requeridos (para el lote entero)</label>
              {recipeIngredients.map((req, idx) => (
                <div key={idx} className="flex gap-2 mb-2 items-center">
                  <select required value={req.ingredientId} onChange={e => updateRow(idx, 'ingredientId', e.target.value)} className="flex-1 border border-gray-300 p-2 rounded-lg text-sm">
                    <option value="">Seleccionar ingrediente...</option>

                </div>

              <button type="button" onClick={addIngredientRow} className="text-indigo-600 text-sm font-medium mt-2 flex items-center gap-1 hover:text-indigo-800"><Icon name="plus" className="w-4 h-4"/> Añadir otro</button>

      const renderRecipes = () => (

                  <div className="pt-2">
                    <p className="text-xs text-gray-500 mb-1">Potencial con Inventario Actual:</p>
                    <div className="flex justify-between text-sm items-center">
                       <span className="text-gray-700">Materia prima para:</span>
                       <span className="font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded">{yieldInfo.portions} porciones</span>
                    </div>
                  </div>

                  <div className="bg-emerald-50 p-3 rounded-xl mt-4 border border-emerald-100">
                     <p className="text-sm font-bold text-emerald-900 flex justify-between items-center">

                     </p>
                  </div>
                </div>
              );

                      <option value="">Elegir receta...</option>
                      {recipes.map(r => {
                          const max = calculateMaxYield(r);
                          return <option key={r.id} value={r.id} disabled={max.batches === 0}>{r.name} (Material para {max.batches} receta{max.batches !== 1 ? 's' : ''} completa{max.batches !== 1 ? 's' : ''})</option>;
                      })}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">¿Cuántas veces preparaste la receta completa?</label>
                    <input required type="number" name="batches" min="1" defaultValue="1" className="w-full border border-gray-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Lotes preparados" />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 shadow-md">Producir y Enviar al Stock de Ventas</button>
                </form>
              </div>

              {/* TAB: VENDER */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 relative overflow-hidden">
                <div className="absolute top-0 right-0 p-4 bg-emerald-50 rounded-bl-3xl text-emerald-600"><Icon name="dollar" className="w-6 h-6"/></div>
                <h3 className="text-xl font-bold text-gray-800 mb-2">2. Registrar Venta de Porciones</h3>
                <p className="text-gray-500 mb-6 text-sm">Vende porciones individuales de tu Stock Listo. Ingresará el dinero a la contabilidad.</p>
                
                <form onSubmit={handleSell} className="space-y-5">

                    </div>

                      <label className="block text-sm font-medium text-gray-700 mb-1">Precio x Porción</label>
                      <input required type="number" step="0.01" name="price" className="w-full border border-gray-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" placeholder="$" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Modalidad de Venta</label>
                    <select required name="saleType" onChange={(e) => document.getElementById('debtorNameField').style.display = e.target.value === 'debt' ? 'block' : 'none'} className="w-full border border-gray-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                      <option value="detal">Al Detal (Contado)</option>

                </form>
              </div>
            </div>
          </div>
        );
      };

        const totalIng = sales.reduce((acc, s) => acc + s.revenue, 0);
        const repo = sales.reduce((acc, s) => acc + ((s.unitCost || 0) * s.qty), 0);
        const brut = totalIng - repo;
        const totalExp = expenses.reduce((acc, e) => acc + e.amount, 0);
        const neta = brut - totalExp;
        const sueldo = neta > 0 ? neta * (finances.savingsPercentage / 100) : 0;
        
        return (
          <div className="space-y-6 animate-fade-in">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Contabilidad Real y Gastos</h2>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              {/* Estado de Resultados (Cuentas Claras) */}
              <div className="bg-gray-900 p-6 rounded-2xl shadow-lg text-white">
                <h3 className="text-lg font-bold mb-6 text-gray-100 flex items-center gap-2"><Icon name="dashboard"/> Estado de Resultados Reales</h3>
                
                <div className="space-y-4 text-sm">
                  <div className="flex justify-between border-b border-gray-700 pb-2">
                    <span className="text-gray-400">Total Ingresos por Ventas</span>
                    <span className="font-bold text-emerald-400">{formatCurrency(totalIng)}</span>
                  </div>
                  <div className="flex justify-between border-b border-gray-700 pb-2">
                    <span className="text-gray-400">(-) Costo Reposición Ingredientes</span>

                  </div>

                    <span className="font-bold text-blue-300">{formatCurrency(neta - sueldo)}</span>

              <div>
                <label className="block text-sm font-medium mb-1 text-gray-700">Logo de la Tienda (Pega el enlace web de tu imagen)</label>
                <input type="text" placeholder="Ej: https://misitio.com/logo.png" value={generalSettings.logo || ''} onChange={e => setGeneralSettings({...generalSettings, logo: e.target.value})} className="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div>
                  <label className="text-xs font-bold text-gray-600 block mb-1">Moneda Principal</label>
                  <select value={generalSettings.currency} onChange={e => setGeneralSettings({...generalSettings, currency: e.target.value})} className="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="USD">Dólares ($)</option>
                    <option value="VES">Bolívares (Bs)</option>
                    <option value="EUR">Euros (€)</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-600 block mb-1">Tasa Bs ($1)</label>
                  <input type="number" step="0.01" value={generalSettings.rateBs} onChange={e => setGeneralSettings({...generalSettings, rateBs: parseFloat(e.target.value)})} className="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-600 block mb-1">Tasa Eur ($1)</label>
                  <input type="number" step="0.01" value={generalSettings.rateEur} onChange={e => setGeneralSettings({...generalSettings, rateEur: parseFloat(e.target.value)})} className="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
              </div>
              <button type="submit" className="w-full sm:w-auto bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-md">Actualizar Datos de Marca</button>
            </form>
          </div>

          <div className="bg-red-50 p-6 rounded-2xl shadow-sm border border-red-200">
             <h3 className="text-lg font-bold text-red-800 border-b border-red-200 pb-2 flex items-center gap-2 mb-4"><Icon name="warning" className="w-5 h-5"/> Zona de Peligro (Cuidado)</h3>
             <p className="text-sm text-red-600 mb-4 font-medium">Esta acción vaciará completamente la base de datos (Ingredientes, Recetas, Gastos y Ventas). Es útil para limpiar las pruebas antes de arrancar en vivo. No se puede deshacer.</p>
             <button onClick={() => { setModalType('resetSystem'); setShowModal(true); }} className="bg-red-600 text-white px-4 py-3 rounded-xl font-bold hover:bg-red-700 shadow flex items-center justify-center gap-2 w-full sm:w-auto">
               <Icon name="trash" className="w-5 h-5"/> Restablecer Todo a Cero
             </button>
          </div>
        </div>
      );

      return (
        <div className="h-screen w-full flex flex-col md:flex-row overflow-hidden">
          
          {/* NOTIFICACIONES TOAST */}
          {notification.show && (
            <div className={`fixed top-4 right-4 z-50 p-4 rounded-xl shadow-xl flex items-center gap-3 animate-slide-in text-white ${notification.type === 'error' ? 'bg-red-600' : notification.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
              <Icon name={notification.type === 'error' ? 'trash' : 'dashboard'} className="w-6 h-6"/>
              <p className="font-medium text-sm pr-4">{notification.message}</p>
            </div>
          )}

          {/* Menú Lateral (Sidebar) */}
          <aside className="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm flex-shrink-0 overflow-y-auto">
            <div className="p-6 border-b border-gray-100 flex flex-col items-center md:items-start text-center md:text-left">
              {generalSettings.logo ? <img src={generalSettings.logo} alt="Logo" className="h-16 w-auto mb-2 object-contain rounded-lg" /> : <div className="text-indigo-700 mb-2"><Icon name="chef" className="w-8 h-8"/></div>}
              <h1 className="text-xl font-black text-gray-800 break-words w-full">{generalSettings.name}</h1>
              <p className="text-xs text-emerald-600 mt-1 font-medium">• Nube Activa</p>
            </div>
            <nav className="flex-1 p-4 space-y-1 overflow-x-auto flex md:flex-col md:overflow-visible">
              {/* Añadida pestaña de Configuración aquí */}
              {[{ id: 'dashboard', name: 'Resumen' }, { id: 'inventory', name: 'Materia Prima' }, { id: 'recipes', name: 'Recetas y Stock' }, { id: 'production', name: 'Fábrica y Ventas' }, { id: 'finances', name: 'Contabilidad' }, { id: 'settings', name: 'Ajustes' }].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-3 w-full p-3 rounded-xl transition-all whitespace-nowrap ${activeTab === tab.id ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm border border-indigo-100' : 'text-gray-600 hover:bg-gray-100 border border-transparent'}`}>
                  <Icon name={tab.id === 'settings' ? 'settings' : 'dashboard'} className="w-5 h-5"/> {tab.name}
                </button>
              ))}
              <div className="md:mt-auto pt-4 md:border-t md:border-gray-100">
                <button onClick={exportBackup} className="flex items-center gap-3 w-full p-3 rounded-xl text-gray-600 hover:bg-gray-100 whitespace-nowrap text-sm"><Icon name="download" className="w-5 h-5"/> Bajar Respaldo JSON</button>
              </div>
            </nav>
          </aside>

          {/* Área Principal */}
          <main className="flex-1 p-6 md:p-8 overflow-y-auto h-full bg-gray-50/50">
            {activeTab === 'dashboard' && renderDashboard()}
            {activeTab === 'inventory' && renderInventory()}
            {activeTab === 'recipes' && renderRecipes()}
            {activeTab === 'production' && renderProduction()}
            {activeTab === 'finances' && renderFinances()}
            {/* Renderizar Configuración */}
            {activeTab === 'settings' && renderSettings()}
          </main>

          {/* Área de Modales (Ventanas Emergentes) */}
          {showModal && (
            <div className="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-40 animate-fade-in backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto border border-gray-100">
                
                {modalType === 'recipe' && (
                  <>
                    <h3 className="text-xl font-bold text-gray-800 mb-4">{editingRecipe ? 'Editar Receta' : 'Crear Receta'}</h3>
                    <CreateRecipeForm onSave={handleSaveRecipe} onCancel={() => {setShowModal(false); setEditingRecipe(null);}} inventory={ingredients} initialData={editingRecipe} />
                  </>
                )}
                
                {modalType === 'addIngredient' && (
                   <form onSubmit={handleSaveIngredient} className="space-y-4">
                     <h3 className="text-xl font-bold text-gray-800 mb-4">{editingIngredient ? 'Editar Ingrediente' : 'Añadir Ingrediente'}</h3>
                     <div>
                       <label className="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                       <input required name="name" type="text" defaultValue={editingIngredient?.name} className="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ej: Harina de Trigo" />
                     </div>
                     <div>
                       <label className="block text-sm font-medium text-gray-700 mb-1">Unidad de Medida Base</label>
                       <select required name="unit" defaultValue={editingIngredient?.unit || 'g'} className="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                         <option value="g">Gramos (g)</option>
                         <option value="ml">Mililitros (ml)</option>
                         <option value="ud">Unidades (ud)</option>
                       </select>
                       <p className="text-xs text-gray-500 mt-1">El sistema convertirá a Kilos o Litros automáticamente cuando pases de 1000.</p>
                     </div>
                     <div className="flex justify-end gap-3 pt-4 border-t border-gray-100">
                       <button type="button" onClick={()=>{setShowModal(false); setEditingIngredient(null);}} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                       <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">Guardar</button>
                     </div>
                   </form>
                )}
                
                 {modalType === 'addPurchase' && (
                   <form onSubmit={handleAddPurchase} className="space-y-4">
                     <h3 className="text-xl font-bold text-gray-800 mb-4">Registrar Factura de Compra</h3>
                     <div>
                       <label className="block text-sm font-medium text-gray-700 mb-1">Ingrediente Comprado</label>
                       <select required name="ingredientId" className="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                         <option value="">Seleccionar...</option>
                         {ingredients.map(i => <option key={i.id} value={i.id}>{i.name} (en {i.unit})</option>)}
                       </select>
                     </div>
                     <div className="grid grid-cols-2 gap-4">
                       <div>
                         <label className="block text-sm font-medium text-gray-700 mb-1">Cant. Ingresada</label>
                         <input required name="qty" type="number" step="0.1" className="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ej: 1000" title="Si compraste 1 Kilo de Harina, debes colocar 1000 (porque la unidad base es gramos)." />
                         <p className="text-xs text-gray-500 mt-1">Ingresa el valor en la unidad base (ej: 1000 si es 1Kg).</p>
                       </div>
                       <div>
                         <label className="block text-sm font-medium text-gray-700 mb-1">Costo Pagado ($)</label>
                         <input required name="totalCost" type="number" step="0.01" className="w-full border border-gray-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ej: 2.50" />
                       </div>
                     </div>
                     <div className="flex justify-end gap-3 pt-4 border-t border-gray-100">
                       <button type="button" onClick={()=>setShowModal(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                       <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">Registrar Compra</button>
                     </div>
                   </form>
                )}

                {/* MODAL DE SEGURIDAD EXTREMA PARA BORRAR TODO */}
                {modalType === 'resetSystem' && (
                  <form onSubmit={handleResetSystem} className="space-y-4">
                    <div className="bg-red-100 text-red-600 p-4 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-2 shadow-inner">
                      <Icon name="warning" className="w-10 h-10" />
                    </div>
                    <h3 className="text-2xl font-black text-center text-gray-800">¿Estás absolutamente seguro?</h3>
                    <div className="bg-red-50 border border-red-200 p-4 rounded-xl text-center">
                       <p className="text-sm text-gray-700 mb-3">Estás a punto de borrar <b>todo el historial de tu negocio</b> para dejarlo de fábrica.</p>
                       <p className="text-xs text-gray-600">Para confirmar, por favor escribe la palabra <span className="font-mono font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded">BORRAR</span> en la casilla.</p>
                    </div>
                    <div>
                      <input required name="confirmText" type="text" className="w-full border-2 border-red-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-red-500 text-center font-bold text-xl uppercase tracking-widest" placeholder="Escribe BORRAR" />
                    </div>
                    <div className="flex justify-end gap-3 pt-4">
                      <button type="button" onClick={()=>setShowModal(false)} className="px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-xl font-bold w-full">Cancelar</button>
                      <button type="submit" className="px-4 py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 shadow-md font-black w-full uppercase">Sí, Borrar Todo</button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BakeryControlSystem />);
  </script>
</body>
</html>
