<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetControl - Pastelería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;
    
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Configuración Real de tu Base de Datos Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDxRbgfPR04Ecn0RPbDXFRXrY0gC1qf638",
      authDomain: "sweetcontrol-bd.firebaseapp.com",
      projectId: "sweetcontrol-bd",
      storageBucket: "sweetcontrol-bd.firebasestorage.app",
      messagingSenderId: "1062190162900",
      appId: "1:1062190162900:web:055631b9cd40239450ec41",
      measurementId: "G-CY32ETW41C"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'sweet-control-app';

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        box: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />,
        book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
        chef: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 15c0-4.418-4.03-8-9-8s-9 3.582-9 8h18zM15 7V3h-6v4" />,
        dollar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
        users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      };
      return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">{icons[name] || icons.box}</svg>;
    };

    function BakeryControlSystem() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [user, setUser] = useState(null);
      
      const [ingredients, setIngredients] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [sales, setSales] = useState([]);
      const [debtors, setDebtors] = useState([]);
      const [expenses, setExpenses] = useState([]);
      
      const [finances, setFinances] = useState({ savingsPercentage: 50 });
      const [generalSettings, setGeneralSettings] = useState({ name: 'SweetControl', logo: null, currency: 'USD', rateBs: 40, rateEur: 0.92 });

      const [showModal, setShowModal] = useState(false);
      const [modalType, setModalType] = useState(''); 
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [editingIngredient, setEditingIngredient] = useState(null);

      const [notification, setNotification] = useState({ show: false, message: '', type: 'info' });

      const showNotification = (message, type = 'info') => {
        setNotification({ show: true, message, type });
        setTimeout(() => setNotification({ show: false, message: '', type: 'info' }), 5000);
      };

      useEffect(() => {
        signInAnonymously(auth).catch(console.error);
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const basePath = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);

        const unsubIngredients = onSnapshot(basePath('ingredients'), snap => setIngredients(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubRecipes = onSnapshot(basePath('recipes'), snap => setRecipes(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubSales = onSnapshot(basePath('sales'), snap => setSales(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)));
        const unsubDebtors = onSnapshot(basePath('debtors'), snap => setDebtors(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubExpenses = onSnapshot(basePath('expenses'), snap => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)));

        const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'finances'), docSnap => {
          if (docSnap.exists()) setFinances(docSnap.data());
        });
        const unsubGeneral = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), docSnap => {
          if (docSnap.exists()) setGeneralSettings(prev => ({ ...prev, ...docSnap.data() }));
        });

        return () => { unsubIngredients(); unsubRecipes(); unsubSales(); unsubDebtors(); unsubExpenses(); unsubSettings(); unsubGeneral(); };
      }, [user]);

      if (!user) return <div className="min-h-screen flex items-center justify-center bg-gray-50 text-indigo-600 font-medium">Conectando...</div>;

      const formatCurrency = (amount) => {
        let converted = amount;
        let symbol = '$';
        if (generalSettings.currency === 'VES') { converted = amount * generalSettings.rateBs; symbol = 'Bs '; } 
        else if (generalSettings.currency === 'EUR') { converted = amount * generalSettings.rateEur; symbol = '€'; }
        return `${symbol}${converted.toFixed(2)}`;
      };

      const formatUnit = (amount, unit) => {
        if (amount >= 1000 && unit === 'g') return `${(amount / 1000).toFixed(2)} kg`;
        if (amount >= 1000 && unit === 'ml') return `${(amount / 1000).toFixed(2)} L`;
        return `${amount.toFixed(1)} ${unit}`;
      };

      const exportBackup = () => {
        const backupData = { ingredients, recipes, sales, debtors, expenses, finances, generalSettings };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Respaldo_${generalSettings.name}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const calculateRecipeCost = (recipe) => {
        return recipe.ingredients.reduce((total, req) => {
          const ing = ingredients.find(i => i.id === req.ingredientId);
          return total + (ing ? (ing.costPerUnit || 0) * req.qty : 0);
        }, 0);
      };

      const calculateMaxYield = (recipe) => {
        let maxBatches = Infinity;
        for (const req of recipe.ingredients) {
          const ing = ingredients.find(i => i.id === req.ingredientId);
          if (!ing || ing.stock < req.qty || req.qty === 0) return { batches: 0, portions: 0 };
          const batches = Math.floor(ing.stock / req.qty);
          if (batches < maxBatches) maxBatches = batches;
        }
        if (maxBatches === Infinity) return { batches: 0, portions: 0 };
        return { batches: maxBatches, portions: maxBatches * (recipe.portions || 1) };
      };

      const handleAddPurchase = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const ingredientId = fd.get('ingredientId');
        const qty = parseFloat(fd.get('qty'));
        const totalCost = parseFloat(fd.get('totalCost'));

        const ing = ingredients.find(i => i.id === ingredientId);
        if (!ing) return;

        const newTotalValue = ((ing.stock || 0) * (ing.costPerUnit || 0)) + totalCost;
        const newStock = (ing.stock || 0) + qty;
        const newCostPerUnit = newTotalValue / newStock;

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', ingredientId), { stock: newStock, costPerUnit: newCostPerUnit }, { merge: true });
        setShowModal(false);
        showNotification("Compra registrada.", 'success');
      };

      const handleSaveIngredient = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const id = editingIngredient ? editingIngredient.id : Date.now().toString();
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', id), {
          name: fd.get('name'), unit: fd.get('unit'), stock: editingIngredient ? editingIngredient.stock : 0, costPerUnit: editingIngredient ? editingIngredient.costPerUnit : 0
        }, { merge: true });
        setShowModal(false);
        setEditingIngredient(null);
        showNotification("Ingrediente guardado.", 'success');
      };

      const handleDeleteIngredient = async (id) => {
        if(recipes.some(r => r.ingredients.some(i => i.ingredientId === id))) return showNotification("Está en uso en una receta.", 'error');
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', id));
        showNotification("Eliminado.", 'info');
      };

      const handleSaveRecipe = async (recipeData) => {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipeData.id), recipeData, { merge: true });
        setShowModal(false);
        setEditingRecipe(null);
        showNotification("Receta guardada.", 'success');
      };

      const handleDeleteRecipe = async (id) => {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', id));
        showNotification("Receta eliminada.", 'info');
      };

      const handleProduce = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recipeId = fd.get('recipeId');
        const batchesToMake = parseInt(fd.get('batches'));
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;

        const yieldInfo = calculateMaxYield(recipe);
        if (batchesToMake > yieldInfo.batches) return showNotification("Faltan ingredientes.", 'error');

        for (const req of recipe.ingredients) {
          const ing = ingredients.find(i => i.id === req.ingredientId);
          if (ing) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ingredients', ing.id), { stock: ing.stock - (req.qty * batchesToMake) }, { merge: true });
        }
        
        const portionsProduced = batchesToMake * recipe.portions;
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipe.id), { stock: (recipe.stock || 0) + portionsProduced }, { merge: true });
        e.target.reset();
        showNotification(`¡Éxito! Produciste ${portionsProduced} porciones.`, 'success');
      };

      const handleSell = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recipeId = fd.get('recipeId');
        const qtyToSell = parseInt(fd.get('qty'));
        const salePrice = parseFloat(fd.get('price'));
        const saleType = fd.get('saleType');
        const debtorName = fd.get('debtorName');
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe || qtyToSell > (recipe.stock || 0)) return showNotification("Stock insuficiente.", 'error');

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', recipe.id), { stock: recipe.stock - qtyToSell }, { merge: true });
        const finalRevenue = salePrice * qtyToSell;
        const unitCost = calculateRecipeCost(recipe) / recipe.portions;
        const timestamp = Date.now();
        const dateStr = new Date().toISOString().split('T')[0];

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sales', timestamp.toString()), {
          date: dateStr, timestamp, recipeId, recipeName: recipe.name, qty: qtyToSell, revenue: finalRevenue, unitCost, type: saleType
        });

        if (saleType === 'debt') {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'debtors', `debt_${timestamp}`), { name: debtorName || 'Cliente', amount: finalRevenue, date: dateStr, recipeName: recipe.name });
        }
        e.target.reset();
        showNotification("Venta registrada.", 'success');
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', Date.now().toString()), {
          date: new Date().toISOString().split('T')[0], timestamp: Date.now(), description: fd.get('description'), amount: parseFloat(fd.get('amount'))
        });
        e.target.reset();
        showNotification("Gasto añadido.", 'success');
      };

      const renderDashboard = () => {
        const totalInv = ingredients.reduce((acc, i) => acc + ((i.stock || 0) * (i.costPerUnit || 0)), 0);
        const finishedVal = recipes.reduce((acc, r) => acc + ((r.stock || 0) * (calculateRecipeCost(r) / (r.portions || 1))), 0);
        const totalDebt = debtors.reduce((acc, d) => acc + d.amount, 0);
        return (
          <div className="space-y-6 animate-fade-in">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Resumen del Negocio</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 flex items-center space-x-4">
                <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><Icon name="box" className="w-8 h-8"/></div>
                <div><p className="text-sm text-gray-500 font-medium">Materia Prima</p><p className="text-2xl font-bold text-gray-800">{formatCurrency(totalInv)}</p></div>
              </div>
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center space-x-4">
                <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="chef" className="w-8 h-8"/></div>
                <div><p className="text-sm text-gray-500 font-medium">Postres Listos (Costo)</p><p className="text-2xl font-bold text-gray-800">{formatCurrency(finishedVal)}</p></div>
              </div>
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-red-100 flex items-center space-x-4">
                <div className="p-3 bg-red-50 text-red-600 rounded-xl"><Icon name="users" className="w-8 h-8"/></div>
                <div><p className="text-sm text-gray-500 font-medium">Cuentas por Cobrar</p><p className="text-2xl font-bold text-gray-800">{formatCurrency(totalDebt)}</p></div>
              </div>
            </div>
          </div>
        );
      };

      const renderInventory = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <h2 className="text-2xl font-bold text-gray-800">Inventario (Materia Prima)</h2>
            <div className="flex gap-2 w-full sm:w-auto">
              <button onClick={() => { setEditingIngredient(null); setModalType('addIngredient'); setShowModal(true); }} className="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 font-medium shadow-sm">Nuevo Ingrediente</button>
              <button onClick={() => { setModalType('addPurchase'); setShowModal(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium shadow-sm">Ingresar Compra</button>
            </div>
          </div>
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-gray-50 text-sm text-gray-600 border-b border-gray-200">
                  <th className="py-4 px-6 font-semibold">Ingrediente</th>
                  <th className="py-4 px-6 font-semibold">Stock</th>
                  <th className="py-4 px-6 font-semibold">Costo Prom.</th>
                  <th className="py-4 px-6 font-semibold">Valor Total</th>
                  <th className="py-4 px-6 font-semibold text-center">Acciones</th>
                </tr>
              </thead>
              <tbody>
                {ingredients.map(ing => (
                  <tr key={ing.id} className="border-b border-gray-50 hover:bg-gray-50 group">
                    <td className="py-4 px-6 font-medium text-gray-800">{ing.name}</td>
                    <td className="py-4 px-6 font-semibold">{formatUnit(ing.stock || 0, ing.unit)}</td>
                    <td className="py-4 px-6 text-gray-600">{formatCurrency(ing.costPerUnit || 0)} / {ing.unit}</td>
                    <td className="py-4 px-6 font-medium text-emerald-600">{formatCurrency((ing.stock || 0) * (ing.costPerUnit || 0))}</td>
                    <td className="py-4 px-6 text-center">
                      <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onClick={() => { setEditingIngredient(ing); setModalType('addIngredient'); setShowModal(true); }} className="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded"><Icon name="edit" className="w-4 h-4"/></button>
                        <button onClick={() => handleDeleteIngredient(ing.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded"><Icon name="trash" className="w-4 h-4"/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      const CreateRecipeForm = ({ onSave, onCancel, inventory, initialData }) => {
        const [name, setName] = useState(initialData ? initialData.name : '');
        const [portions, setPortions] = useState(initialData ? initialData.portions : 1);
        const [recipeIngredients, setRecipeIngredients] = useState(initialData ? initialData.ingredients : [{ ingredientId: '', qty: 0 }]);

        const totalCost = recipeIngredients.reduce((total, req) => {
          const ing = inventory.find(i => i.id === req.ingredientId);
          return total + (ing ? (ing.costPerUnit || 0) * req.qty : 0);
        }, 0);

        return (
          <form onSubmit={(e) => { e.preventDefault(); onSave({ id: initialData ? initialData.id : Date.now().toString(), name, portions, ingredients: recipeIngredients, stock: initialData ? initialData.stock : 0 }); }} className="space-y-4">
            <div><label className="block text-sm font-medium text-gray-700 mb-1">Nombre Receta</label><input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border border-gray-300 p-2 rounded-lg" /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">Porciones por Lote</label><input required type="number" min="1" value={portions} onChange={e => setPortions(parseInt(e.target.value))} className="w-full border border-gray-300 p-2 rounded-lg" /></div>
            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">Ingredientes</label>
              {recipeIngredients.map((req, idx) => (
                <div key={idx} className="flex gap-2 mb-2 items-center">
                  <select required value={req.ingredientId} onChange={e => { const n = [...recipeIngredients]; n[idx].ingredientId = e.target.value; setRecipeIngredients(n); }} className="flex-1 border border-gray-300 p-2 rounded-lg text-sm">
                    <option value="">Seleccionar...</option>
                    {inventory.map(i => <option key={i.id} value={i.id}>{i.name} ({i.unit})</option>)}
                  </select>
                  <input required type="number" min="0.1" step="0.1" value={req.qty} onChange={e => { const n = [...recipeIngredients]; n[idx].qty = parseFloat(e.target.value) || 0; setRecipeIngredients(n); }} className="w-24 border border-gray-300 p-2 rounded-lg text-sm" placeholder="Cant" />
                  <button type="button" onClick={() => setRecipeIngredients(recipeIngredients.filter((_, i) => i !== idx))} className="p-2 text-red-500 hover:bg-red-50 rounded"><Icon name="trash" className="w-4 h-4"/></button>
                </div>
              ))}
              <button type="button" onClick={() => setRecipeIngredients([...recipeIngredients, { ingredientId: '', qty: 0 }])} className="text-indigo-600 text-sm font-medium mt-1">+ Añadir ingrediente</button>
            </div>
            <div className="bg-indigo-50 p-3 rounded-xl text-sm text-indigo-900 font-bold flex justify-between"><span>Costo Total Lote:</span> <span>{formatCurrency(totalCost)}</span></div>
            <div className="flex justify-end gap-2 pt-3 border-t">
              <button type="button" onClick={onCancel} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
              <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Guardar</button>
            </div>
          </form>
        );
      };

      const renderRecipes = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-gray-800">Recetas</h2>
            <button onClick={() => { setEditingRecipe(null); setModalType('recipe'); setShowModal(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm">Crear Receta</button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {recipes.map(recipe => {
              const cost = calculateRecipeCost(recipe);
              const yieldInfo = calculateMaxYield(recipe);
              return (
                <div key={recipe.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 relative group flex flex-col">
                  <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onClick={() => { setEditingRecipe(recipe); setModalType('recipe'); setShowModal(true); }} className="p-1.5 bg-gray-100 text-indigo-600 rounded"><Icon name="edit" className="w-4 h-4"/></button>
                    <button onClick={() => handleDeleteRecipe(recipe.id)} className="p-1.5 bg-gray-100 text-red-600 rounded"><Icon name="trash" className="w-4 h-4"/></button>
                  </div>
                  <h3 className="text-xl font-bold text-gray-800 mb-1 pr-16">{recipe.name}</h3>
                  <p className="text-xs text-gray-500 mb-4 bg-gray-100 px-2 py-1 rounded inline-block">Rinde: {recipe.portions} porciones</p>
                  <div className="space-y-2 text-sm flex-1 border-b pb-4">
                    <div className="flex justify-between"><span className="text-gray-600">Costo Lote:</span><span className="font-semibold text-red-600">{formatCurrency(cost)}</span></div>
                    <div className="flex justify-between"><span className="text-gray-600">Potencial Actual:</span><span className="font-bold text-indigo-600">{yieldInfo.portions} porciones</span></div>
                  </div>
                  <div className="bg-emerald-50 p-3 rounded-xl mt-4 border border-emerald-100 flex justify-between items-center font-bold text-emerald-900 text-sm">
                    <span>Stock para Vender:</span> <span className="text-lg bg-emerald-600 text-white px-3 py-0.5 rounded-lg">{recipe.stock || 0}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      const renderProduction = () => (
        <div className="space-y-6 animate-fade-in">
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Fábrica y Ventas</h2>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100">
              <h3 className="text-xl font-bold text-gray-800 mb-2">1. Fabricar Lote</h3>
              <form onSubmit={handleProduce} className="space-y-4">
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Receta</label><select required name="recipeId" className="w-full border border-gray-300 p-3 rounded-xl"><option value="">Elegir...</option>{recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>}</select></div>
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Cant. Lotes</label><input required type="number" name="batches" min="1" defaultValue="1" className="w-full border border-gray-300 p-3 rounded-xl" /></div>
                <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow">Producir</button>
              </form>
            </div>
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
              <h3 className="text-xl font-bold text-gray-800 mb-2">2. Vender Porciones</h3>
              <form onSubmit={handleSell} className="space-y-4">
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Producto Listo</label><select required name="recipeId" className="w-full border border-gray-300 p-3 rounded-xl"><option value="">Elegir...</option>{recipes.filter(r => (r.stock || 0) > 0).map(r => <option key={r.id} value={r.id}>{r.name} ({r.stock} disp.)</option>}</select></div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">Cant.</label><input required type="number" name="qty" min="1" defaultValue="1" className="w-full border border-gray-300 p-3 rounded-xl" /></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">Precio x Unid.</label><input required type="number" step="0.01" name="price" className="w-full border border-gray-300 p-3 rounded-xl" /></div>
                </div>
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tipo</label><select name="saleType" onChange={e => document.getElementById('deb').style.display = e.target.value === 'debt' ? 'block' : 'none'} className="w-full border border-gray-300 p-3 rounded-xl"><option value="detal">Detal</option><option value="mayor">Mayor</option><option value="debt">Crédito (Fiar)</option></select></div>
                <div id="deb" style={{display: 'none'}}><label className="block text-sm font-medium text-gray-700 mb-1">Deudor</label><input type="text" name="debtorName" className="w-full border border-gray-300 p-3 rounded-xl" /></div>
                <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow">Vender</button>
              </form>
            </div>
          </div>
        </div>
      );

      const renderFinances = () => {
        const totalIng = sales.reduce((acc, s) => acc + s.revenue, 0);
        const repo = sales.reduce((acc, s) => acc + ((s.unitCost || 0) * s.qty), 0);
        const brut = totalIng - repo;
        const totalExp = expenses.reduce((acc, e) => acc + e.amount, 0);
        const neta = brut - totalExp;
        const sueldo = neta > 0 ? neta * (finances.savingsPercentage / 100) : 0;
        return (
          <div className="space-y-6 animate-fade-in">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Contabilidad Real</h2>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              <div className="bg-gray-900 p-6 rounded-2xl text-white space-y-4">
                <h3 className="text-lg font-bold border-b border-gray-700 pb-2">Estado de Resultados</h3>
                <div className="flex justify-between text-sm"><span className="text-gray-400">Ventas Totales:</span><span className="text-emerald-400 font-bold">{formatCurrency(totalIng)}</span></div>
                <div className="flex justify-between text-sm"><span className="text-gray-400">(-) Costo Reposición:</span><span className="text-red-400 font-bold">-{formatCurrency(repo)}</span></div>
                <div className="flex justify-between text-sm bg-gray-800 p-2 rounded"><span className="font-medium">Ganancia Bruta:</span><span className="text-blue-300 font-bold">{formatCurrency(brut)}</span></div>
                <div className="flex justify-between text-sm"><span className="text-gray-400">(-) Gastos (Luz, Gas, Delivery):</span><span className="text-orange-400 font-bold">-{formatCurrency(totalExp)}</span></div>
                <div className="flex justify-between text-lg font-black bg-gray-800 p-3 rounded border border-gray-600 pt-3"><span>GANANCIA NETA:</span><span className={neta >= 0 ? "text-emerald-400" : "text-red-500"}>{formatCurrency(neta)}</span></div>
                <div className="mt-4 p-4 bg-gray-800 rounded-xl space-y-2">
                  <div className="flex justify-between items-center text-sm">
                    <span>Sueldo Libre (<input type="number" className="w-12 bg-gray-700 text-center rounded text-xs py-1" value={finances.savingsPercentage} onChange={e => setFinances({savingsPercentage: Number(e.target.value)})} />%):</span>
                    <span className="text-emerald-400 font-bold">{formatCurrency(sueldo)}</span>
                  </div>
                </div>
              </div>
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border">
                  <h3 className="text-lg font-bold mb-4">Registrar Gasto Operativo</h3>
                  <form onSubmit={handleAddExpense} className="flex gap-2">
                    <input required type="text" name="description" placeholder="Concepto (Gas, luz...)" className="flex-1 border p-2 rounded text-sm" />
                    <input required type="number" step="0.01" name="amount" placeholder="$ Costo" className="w-24 border p-2 rounded text-sm" />
                    <button type="submit" className="bg-orange-500 text-white px-4 rounded font-bold">Añadir</button>
                  </form>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border">
                  <h3 className="text-lg font-bold mb-4">Cuentas por Cobrar</h3>
                  {debtors.map(d => (
                    <div key={d.id} className="flex justify-between items-center p-3 bg-red-50 rounded mb-2 border border-red-100 text-sm">
                      <div><b>{d.name}</b> <span className="text-xs text-gray-500">({d.recipeName})</span></div>
                      <div className="flex items-center gap-2 font-bold text-red-600">{formatCurrency(d.amount)}<button onClick={async () => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'debtors', d.id))} className="text-xs bg-white text-emerald-600 border px-2 py-1 rounded">Pagó</button></div>
                    </div>
                  ))}
                  {debtors.length === 0 && <p className="text-sm text-gray-400">Sin deudas pendientes.</p>}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderSettings = () => (
        <div className="space-y-6 animate-fade-in max-w-2xl">
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Configuración del Negocio</h2>
          <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <form onSubmit={async (e) => { e.preventDefault(); await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), generalSettings); showNotification("Guardado.", 'success'); }} className="space-y-4">
              <div><label className="block text-sm font-medium mb-1">Nombre del Negocio</label><input type="text" value={generalSettings.name} onChange={e => setGeneralSettings({...generalSettings, name: e.target.value})} className="w-full border p-2 rounded" /></div>
              <div>
                <label className="block text-sm font-medium mb-1">Logo URL (Opcional)</label>
                <input type="text" placeholder="https://..." value={generalSettings.logo || ''} onChange={e => setGeneralSettings({...generalSettings, logo: e.target.value})} className="w-full border p-2 rounded text-sm" />
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div><label className="text-xs">Moneda</label><select value={generalSettings.currency} onChange={e => setGeneralSettings({...generalSettings, currency: e.target.value})} className="w-full border p-2 rounded text-sm"><option value="USD">USD ($)</option><option value="VES">Bolívares (Bs)</option><option value="EUR">Euros (€)</option></select></div>
                <div><label className="text-xs">Tasa Bs ($1)</label><input type="number" step="0.01" value={generalSettings.rateBs} onChange={e => setGeneralSettings({...generalSettings, rateBs: parseFloat(e.target.value)})} className="w-full border p-2 rounded text-sm" /></div>
                <div><label className="text-xs">Tasa Eur ($1)</label><input type="number" step="0.01" value={generalSettings.rateEur} onChange={e => setGeneralSettings({...generalSettings, rateEur: parseFloat(e.target.value)})} className="w-full border p-2 rounded text-sm" /></div>
              </div>
              <button type="submit" className="bg-indigo-600 text-white px-4 py-2 rounded font-bold">Guardar Cambios</button>
            </form>
          </div>
          <div className="bg-indigo-50 p-4 rounded-xl border flex justify-between items-center">
            <div><h4 className="font-bold text-indigo-900">Respaldo Local</h4><p className="text-xs text-indigo-700">Descarga tu información en JSON.</p></div>
            <button onClick={exportBackup} className="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-bold">Descargar JSON</button>
          </div>
        </div>
      );

      return (
        <div className="h-screen w-full flex flex-col md:flex-row overflow-hidden">
          {notification.show && (
            <div className={`fixed top-4 right-4 z-50 p-4 rounded-xl shadow-xl text-white text-sm font-medium ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>{notification.message}</div>
          )}
          <aside className="w-full md:w-64 bg-white border-r flex flex-col flex-shrink-0">
            <div className="p-6 border-b text-center md:text-left">
              {generalSettings.logo ? <img src={generalSettings.logo} alt="Logo" className="h-12 mx-auto md:mx-0 mb-2 object-contain" /> : <Icon name="chef" className="w-8 h-8 text-indigo-600 mx-auto md:mx-0 mb-2"/>}
              <h1 className="text-lg font-black text-gray-800">{generalSettings.name}</h1>
              <p className="text-xs text-emerald-600 font-medium">• Nube Activa</p>
            </div>
            <nav className="flex-1 p-4 space-y-1 flex md:flex-col overflow-x-auto">
              {[{ id: 'dashboard', name: 'Resumen' }, { id: 'inventory', name: 'Inventario' }, { id: 'recipes', name: 'Recetas' }, { id: 'production', name: 'Fábrica/Ventas' }, { id: 'finances', name: 'Contabilidad' }, { id: 'settings', name: 'Configuración' }].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-3 w-full p-3 rounded-xl text-sm font-medium whitespace-nowrap ${activeTab === tab.id ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}>
                  <Icon name="dashboard" className="w-5 h-5"/> {tab.name}
                </button>
              ))}
            </nav>
          </aside>
          <main className="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
            {activeTab === 'dashboard' && renderDashboard()}
            {activeTab === 'inventory' && renderInventory()}
            {activeTab === 'recipes' && renderRecipes()}
            {activeTab === 'production' && renderProduction()}
            {activeTab === 'finances' && renderFinances()}
            {activeTab === 'settings' && renderSettings()}
          </main>
          {showModal && (
            <div className="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-40 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                {modalType === 'recipe' && <CreateRecipeForm onSave={handleSaveRecipe} onCancel={() => {setShowModal(false); setEditingRecipe(null);}} inventory={ingredients} initialData={editingRecipe} />}
                {modalType === 'addIngredient' && (
                  <form onSubmit={handleSaveIngredient} className="space-y-4">
                    <h3 className="text-xl font-bold">{editingIngredient ? 'Editar' : 'Nuevo'} Ingrediente</h3>
                    <div><label className="text-sm">Nombre</label><input required name="name" defaultValue={editingIngredient?.name} className="w-full border p-2 rounded" /></div>
                    <div><label className="text-sm">Unidad</label><select name="unit" defaultValue={editingIngredient?.unit || 'g'} className="w-full border p-2 rounded"><option value="g">Gramos (g)</option><option value="ml">Mililitros (ml)</option><option value="ud">Unidades (ud)</option></select></div>
                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={()=>setShowModal(false)} className="px-4 py-2 hover:bg-gray-100 rounded">Cancelar</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded">Guardar</button></div>
                  </form>
                )}
                {modalType === 'addPurchase' && (
                  <form onSubmit={handleAddPurchase} className="space-y-4">
                    <h3 className="text-xl font-bold">Registrar Compra</h3>
                    <div><label className="text-sm">Ingrediente</label><select required name="ingredientId" className="w-full border p-2 rounded"><option value="">Elegir...</option>{ingredients.map(i => <option key={i.id} value={i.id}>{i.name} ({i.unit})</option>}</select></div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-sm">Cantidad</label><input required name="qty" type="number" step="0.1" className="w-full border p-2 rounded" placeholder="Ej: 1000" /></div>
                      <div><label className="text-sm">Costo ($)</label><input required name="totalCost" type="number" step="0.01" className="w-full border p-2 rounded" placeholder="Ej: 2.50" /></div>
                    </div>
                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={()=>setShowModal(false)} className="px-4 py-2 hover:bg-gray-100 rounded">Cancelar</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded">Registrar</button></div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<BakeryControlSystem />);
  </script>
</body>
</html>
